version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: video_menu_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videomenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videomenu_prod_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-videomenu}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videomenu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: video_menu_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-videomenu}:${POSTGRES_PASSWORD:-videomenu_prod_secure_2026}@db:5432/${POSTGRES_DB:-videomenu}
      - API_V1_STR=/api/v1
      - ENVIRONMENT=production
    volumes:
      - ../backend/storage:/app/storage

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: video_menu_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_prod_data:

