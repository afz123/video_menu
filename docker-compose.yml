version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: video_menu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videomenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videomenu}
      POSTGRES_DB: ${POSTGRES_DB:-videomenu}
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videomenu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video_menu_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://videomenu:videomenu@db:5432/videomenu
      - API_V1_STR=/api/v1
    ports:
      - "8088:8088"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video_menu_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3033:80"

volumes:
  postgres_data:
